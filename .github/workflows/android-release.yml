name: Android SDK AAR

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build release AAR
        run: gradle --no-daemon assembleRelease
        working-directory: sdk/android

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: applink-adsdk-aar
          path: sdk/android/build/outputs/aar/*-release.aar
          if-no-files-found: error

      - name: Attach AAR to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sdk/android/build/outputs/aar/*-release.aar