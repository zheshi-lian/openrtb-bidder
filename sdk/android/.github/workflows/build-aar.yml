name: Build Android AAR

# 自动出包：推送代码或打 v* tag 时，GitHub 云端自动编译出 AAR（无需本地装 Android SDK/Gradle）
#   · 普通 push -> 在 Actions 页面的 "Artifacts" 里下载 applink-adsdk-aar
#   · 打 tag v1.0.0 并推送 -> 自动在 Releases 页生成带 AAR 的发布
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          ANDROID_SDK_ROOT=$HOME/android-sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmd.zip
          unzip -q cmd.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          ls -l "$SM"
          yes | "$SM" --licenses
          "$SM" "platforms;android-34" "build-tools;34.0.0"

      - name: Build release AAR (library)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: 'assembleRelease'

      - name: Build demo app (verify SDK integration)
        continue-on-error: true
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: ':app:assembleDebug'

      - name: Upload AAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: applink-adsdk-aar
          path: build/outputs/aar/*-release.aar

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/aar/*-release.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
