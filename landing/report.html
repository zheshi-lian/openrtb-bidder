<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据闭环看板 · AppLink</title>
<style>
  :root{--bg:#060b18;--card:#0e1626;--line:#1c2942;--tx:#e6edf7;--dim:#8ea0bd;--a1:#3b82f6;--ok:#34d399;--warn:#fbbf24;--err:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
  h1{font-size:20px;margin-bottom:4px}
  .sub{color:var(--dim);margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi .v{font-size:22px;font-weight:700}
  .kpi .l{color:var(--dim);font-size:12px;margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600}
  .pill{padding:2px 9px;border-radius:999px;font-size:12px}
  .pill.ok{background:rgba(52,211,153,.15);color:var(--ok)}
  .pill.degraded{background:rgba(251,191,36,.15);color:var(--warn)}
  .pill.warn{background:rgba(251,191,36,.15);color:var(--warn)}
  button{background:var(--a1);color:#04122a;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
  .err{color:var(--err)}
</style>
</head>
<body>
<h1>数据闭环看板</h1>
<div class="sub">需先以管理员身份登录控制台（同域 cookie 自动携带）。数据来自 bid_win_log / conv_log / creatives / ab_exposure / alerts。</div>
<button onclick="load()">刷新</button>
<div class="grid" id="kpi"></div>
<div class="card"><h2>SLO <span id="sloPill"></span></h2><div id="slo"></div></div>
<div class="card"><h2>归因（按日）</h2><div id="attr"></div></div>
<div class="card"><h2>创意效果（CTR / CVR）</h2><div id="cr"></div></div>
<div class="card"><h2>A/B 实验</h2><div id="ab"></div></div>
<div class="card"><h2>计划预算建议</h2><div id="cmp"></div></div>
<div class="card"><h2>业务告警</h2><div id="al"></div></div>
<script>
function tb(head, rows, fmt) {
  if (!rows || !rows.length) return '<p class="sub">无数据</p>';
  var h = '<table><thead><tr>' + head.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr></thead><tbody>';
  rows.forEach(function (r) { h += '<tr>' + head.map(function (k) { return '<td>' + (fmt ? fmt(k, r[k]) : r[k]) + '</td>'; }).join('') + '</tr>'; });
  return h + '</tbody></table>';
}
async function J(u) { var r = await fetch(u, { credentials: 'same-origin' }); if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0,120)); return r.json(); }
async function load() {
  try {
    var slo = await J('/api/console/slo');
    var pill = slo.status === 'ok' ? '<span class="pill ok">OK</span>' : '<span class="pill degraded">DEGRADED</span>';
    document.getElementById('sloPill').innerHTML = pill;
    document.getElementById('slo').innerHTML = tb(['指标','当前','目标'], [
      { 指标:'填充率(5m)', 当前:slo.current.fill_rate_5m, 目标:slo.targets.fill_rate_min },
      { 指标:'竞价 p99(ms)', 当前:slo.current.bid_p99_ms, 目标:slo.targets.bid_p99_ms },
      { 指标:'限流计数(5m)', 当前:slo.current.throttled_5m, 目标:slo.targets.error_rate_max }
    ]);
    document.getElementById('kpi').innerHTML =
      '<div class="kpi"><div class="v">' + (slo.current.bid_req_5m || 0) + '</div><div class="l">竞价请求(5m)</div></div>';
    var attr = await J('/api/console/report/attribution?days=7');
    document.getElementById('attr').innerHTML = tb(['日期','胜出(曝光)','毛收入(μ)','点击','转化','金额'], attr.impressions.map(function (x, i) {
      var c = (attr.conversions[i] || {});
      return { 日期:x.d, '胜出(曝光)':x.wins, '毛收入(μ)':x.gross, 点击:c.clicks || 0, 转化:c.conv || 0, 金额:c.amt || 0 };
    }));
    var cr = await J('/api/console/report/creatives');
    document.getElementById('cr').innerHTML = tb(['ID','计划','格式','曝光','点击','转化','CTR','CVR'], cr);
    var ab = await J('/api/console/report/ab');
    document.getElementById('ab').innerHTML = tb(['实验','名称','类型','变体','曝光','胜出','毛收入'], ab);
    var cmp = await J('/api/console/report/campaigns');
    document.getElementById('cmp').innerHTML = tb(['ID','名称','状态','曝光','转化','花费¥','CPA¥','建议'], cmp);
    var al = await J('/api/console/alerts');
    document.getElementById('al').innerHTML = tb(['级别','类型','信息','时间'], al);
  } catch (e) { document.getElementById('kpi').innerHTML = '<p class="err">加载失败：' + e.message + '（请先登录管理员）</p>'; }
}
load();
</script>
</body>
</html>
