<!doctype html>
<html lang="zh">
<head><meta charset="utf-8" /><title>媒体对账看板</title>
<style> body{font-family:system-ui,"Microsoft YaHei",sans-serif;margin:30px;background:#0b1020;color:#e8eefc}
 h2{font-size:18px;color:#e8eefc} table{width:100%;border-collapse:collapse;margin-top:14px;background:#16203a}
 td,th{border:1px solid #26355c;padding:8px;font-size:13px;text-align:left;color:#e8eefc}
 .card{background:#16203a;padding:14px;border-radius:8px;margin:10px 0;border:1px solid #26355c}
 input{padding:6px;width:320px;background:#0d1730;color:#e8eefc;border:1px solid #26355c} button{padding:6px 14px;cursor:pointer;background:#3b82f6;color:#fff;border:0}
 .kpi{display:flex;gap:16px;flex-wrap:wrap} .kpi div{background:#0a0f1d;color:#e5e9f2;border:1px solid #26304a;border-radius:8px;padding:10px 14px} .kpi b{font-size:18px;color:#7fd1ff}
 .hint{font-size:12px;color:#93a3c4}</style></head>
<body>
<div id="ctop"></div>
  <h2>媒体对账看板（收益 / 结算 / 回执状态）</h2>
  <!-- 上手引导：接入清单（取密钥 → 建版位 → SDK 接入 → 自检 → 收款） -->
  <div id="onb"></div>
  <div class="card">
    <label>我的 api_key（入驻时获取；留空看全局 SSP）</label>
    <input id="apikey" placeholder="pub_xxx"> <button onclick="load()">查询</button>
    <div class="hint">api_key 由「媒体方入驻」页注册后返回；凭它只能看到自己的数据。<br>
    <b>已登录媒体账号则无需填写</b>——后端按 token 作用域自动返回你的数据。
    <a href="/register.html#publisher" style="color:#7fd1ff">去登录/注册</a>
    </div>
  </div>
  <div class="kpi" id="kpi"></div>
  <div class="card" id="receiptCard" style="display:none"><h3>回执状态（结算裁决 / 媒体对账）</h3><div id="receipts"></div></div>
  <h2>分媒体方明细（SSP 全局）</h2>
  <table id="tbl"><thead><tr><th>媒体(domain)</th><th>胜出次数</th><th>SSP收入(元)</th><th>媒体分成(元)</th><th>SSP毛利(元)</th></tr></thead><tbody></tbody></table>
  <button onclick="loadGlobal()">刷新全局</button>
  <script src="/admin.js"></script>
  <script>
    function fillKpi(d){
      kpi.innerHTML = `<div>胜出 <b>${d.wins}</b></div><div>SSP收入 <b>${d.gross_cny.toFixed(4)}</b></div><div>媒体分成 <b>${d.payout_cny.toFixed(4)}</b></div><div>SSP毛利 <b>${d.ssp_margin_cny.toFixed(4)}</b></div>`;
    }
    function renderReceipts(d){
      const rc = d.receipts;
      if(!rc){ receiptCard.style.display='none'; return; }
      receiptCard.style.display='block';
      let h = `<div class="kpi" style="margin-top:8px"><div>已发放 <b>${rc.granted||0}</b></div><div>待S2S回执 <b>${rc.pending||0}</b></div><div>已拒绝 <b>${rc.rejected||0}</b></div><div>完播发奖 <b>${d.rewarded_granted||0}/${d.rewarded_total||0}</b></div></div>`;
      const bs = rc.byStatus||{}; const keys = Object.keys(bs);
      if(keys.length){ h+='<table style="margin-top:10px"><thead><tr><th>裁决状态</th><th>次数</th></tr></thead><tbody>'; keys.forEach(k=>{ h+=`<tr><td>${k}</td><td>${bs[k]}</td></tr>`; }); h+='</tbody></table>'; }
      if(d.s2s_enforce) h+='<div class="hint" style="margin-top:8px">S2S_ENFORCE=1：客户端领奖仅为信号，须媒体服务端持密钥回执(/s2s/reward)后才真正结算（二次防刷）。</div>';
      receipts.innerHTML = h;
    }
    async function load(){
      const k = apikey.value.trim();
      // 有 api_key 用它；没填但已登录媒体账号时，不带 key 直接请求——后端按 token 作用域只返回自己的数据。
      const r = await fetch(k ? ('/api/publisher/report?api_key='+encodeURIComponent(k)) : '/api/publisher/report');
      const d = await r.json().catch(()=>({}));
      if (!r.ok || d.error) { kpi.innerHTML = '<div style="color:#c00">'+(d.error||('HTTP '+r.status))+'</div>'; receiptCard.style.display='none'; return; }
      fillKpi(d);
      kpi.insertAdjacentHTML('beforeend', `<div>完播发奖 <b>${d.rewarded_granted}/${d.rewarded_total}</b></div><div>点击 <b>${d.clicks}</b></div><div>转化 <b>${d.conversions}</b></div><div>GMV <b>${d.gmv}</b></div>`);
      renderReceipts(d);
    }
    async function loadGlobal(){
      try {
        const d = await (await fetch('/ssp/report')).json();
        if (!d || !d.ssp) { kpi.innerHTML = '<div style="color:#c00">全局 SSP 视图需管理员令牌（顶部填入 ADMIN_TOKEN）</div>'; return; }
        fillKpi(d.ssp);
        const tb = document.querySelector('#tbl tbody'); tb.innerHTML='';
        (d.publishers||[]).forEach(p=>{ const tr=document.createElement('tr');
          tr.innerHTML=`<td>${p.publisher}</td><td>${p.wins}</td><td>${p.gross_cny.toFixed(4)}</td><td>${p.payout_cny.toFixed(4)}</td><td>${p.ssp_margin_cny.toFixed(4)}</td>`;
          tb.appendChild(tr); });
      } catch (e) { /* 全局 SSP 视图需管理员令牌，非致命 */ }
    }
    // 已登录媒体账号 → 默认看"自己"的报表（按 token 作用域），不再一上来就打管理员全局口，
    // 否则媒体只会一直看到"全局 SSP 视图需管理员令牌"。管理员或想看全局再点「刷新全局」。
    // 未登录时不自动调全局接口（需管理员令牌），而是提示用户登录或填入 API key。
    if (window.Auth && Auth.role && Auth.role() === 'publisher') {
      load(); setInterval(load, 5000);
    } else if (window.Auth && Auth.role && Auth.role() === 'admin') {
      loadGlobal(); setInterval(loadGlobal, 5000);
    } else {
      // 未登录：不自动请求，等用户手动填 API key 或登录
      kpi.innerHTML = '<div style="color:#f0ad4e;padding:12px 0">未登录。请 <a href="/register.html#publisher" style="color:#7fd1ff">登录媒体账号</a> 后自动加载报表，或填入 api_key 后点「查询」。</div>';
    }
  </script>

<script src="/console_top.js"></script>
<script src="/onboarding.js"></script>
<script>Onboarding.mount('publisher','onb');</script>

</body></html>
