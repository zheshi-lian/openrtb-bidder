<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>结算 / 报表 · Settlement</title>
<style>
  :root{--bg:#0b1020;--card:#141b2e;--line:#26304a;--accent:#3b82f6;--ok:#22c55e;--txt:#e5e9f2;--muted:#8a93a6}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 'Microsoft YaHei',system-ui,sans-serif}
  header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header b{font-size:15px} a.nav{color:#7fd1ff;text-decoration:none;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:6px}
  .wrap{padding:18px 22px;max-width:1100px;margin:0 auto}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  h3{margin:0 0 10px;font-size:14px} label{font-size:12px;color:var(--muted);display:block;margin:6px 0 2px}
  input{width:100%;background:#0a0f1d;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font-size:13px;max-width:360px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px} th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
  th{background:#101830;color:var(--muted)} .kpi{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0}
  .kpi div{background:#0a0f1d;border:1px solid var(--line);border-radius:8px;padding:10px 14px} .kpi b{font-size:18px;color:#7fd1ff}
  .hint{font-size:12px;color:var(--muted)}
</style></head>
<body>
<div id="ctop"></div>
<header>
  <b>结算 / 报表</b>
  </header>
<div class="wrap">
  <div class="panel">
    <h3>① SSP 全局结算（由胜出记录聚合，重启不丢）</h3>
    <div class="kpi" id="sspKpi"></div>
    <table id="sspTbl"><thead><tr><th>媒体(domain)</th><th>胜出</th><th>SSP 收入(元)</th><th>媒体分成(元)</th><th>SSP 毛利(元)</th></tr></thead><tbody></tbody></table>
    <button onclick="loadSettlement()">刷新</button>
  </div>

  <div class="panel">
    <h3>② 媒体方自助报表（凭入驻时获取的 api_key 查看自己的数据）</h3>
    <label>api_key</label><input id="apikey" placeholder="pub_xxx">
    <button onclick="loadPub()">查询我的报表</button>
    <div class="kpi" id="pubKpi"></div>
    <span class="hint" id="pubMsg"></span>
  </div>

  <div class="panel">
    <h3>③ 广告主隔离报表（按 advertiser 分账，对标多客户结算）</h3>
    <table id="advTbl"><thead><tr><th>广告主</th><th>曝光</th><th>花费(元)</th><th>GMV(元)</th></tr></thead><tbody></tbody></table>
    <button onclick="loadAdv()">刷新</button>
  </div>
</div>

<script src="/admin.js"></script>
<script>
const $ = id => document.getElementById(id);
async function loadSettlement(){
  const d=await (await fetch('/api/reports/settlement')).json();
  const s=d.ssp;
  sspKpi.innerHTML=`<div>胜出 <b>${s.wins}</b></div><div>SSP 收入 <b>${s.gross_cny.toFixed(4)}</b></div><div>媒体分成 <b>${s.payout_cny.toFixed(4)}</b></div><div>SSP 毛利 <b>${s.ssp_margin_cny.toFixed(4)}</b></div><div>毛利率 <b>${(s.margin_rate*100).toFixed(1)}%</b></div>`;
  const tb=document.querySelector('#sspTbl tbody'); tb.innerHTML='';
  (d.publishers||[]).forEach(p=>{ const tr=document.createElement('tr');
    tr.innerHTML=`<td>${p.publisher}</td><td>${p.wins}</td><td>${p.gross_cny.toFixed(4)}</td><td>${p.payout_cny.toFixed(4)}</td><td>${p.ssp_margin_cny.toFixed(4)}</td>`; tb.appendChild(tr); });
}
async function loadPub(){
  const k=apikey.value.trim(); if(!k){ pubMsg.textContent='请输入 api_key'; return; }
  const d=await (await fetch('/api/publisher/report?api_key='+encodeURIComponent(k))).json();
  if(d.error){ pubMsg.textContent=d.error; pubKpi.innerHTML=''; return; }
  pubMsg.textContent=''; const p=d.publisher;
  pubKpi.innerHTML=`<div>媒体 <b>${p.domain}</b></div><div>分成率 <b>${p.payout_rate}</b></div><div>胜出 <b>${d.wins}</b></div><div>收入 <b>${d.gross_cny.toFixed(4)}</b></div><div>分成 <b>${d.payout_cny.toFixed(4)}</b></div><div>完播发奖 <b>${d.rewarded_granted}/${d.rewarded_total}</b></div><div>点击 <b>${d.clicks}</b></div><div>转化 <b>${d.conversions}</b></div><div>GMV <b>${d.gmv}</b></div>`;
}
async function loadAdv(){
  const rows=await (await fetch('/api/report/advertiser')).json();
  const tb=document.querySelector('#advTbl tbody'); tb.innerHTML='';
  rows.forEach(r=>{ const tr=document.createElement('tr');
    tr.innerHTML=`<td>${r.advertiser}</td><td>${r.impressions}</td><td>${Number(r.spent_cny).toFixed(4)}</td><td>${Number(r.gmv).toFixed(2)}</td>`; tb.appendChild(tr); });
}
loadSettlement(); loadAdv();
</script>
<script src="/console_top.js"></script>
</body></html>
