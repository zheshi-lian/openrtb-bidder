<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADX 运营看板</title>
<style>
  body{font-family:-apple-system,'Microsoft YaHei',sans-serif;margin:0;background:#f4f6fb;color:#1f2937}
  header{background:#0f172a;color:#fff;padding:14px 20px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .wrap{max-width:1100px;margin:18px auto;padding:0 16px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card .k{font-size:12px;color:#6b7280}.card .v{font-size:24px;font-weight:800;margin-top:4px}
  h3{margin:18px 0 8px;font-size:15px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid #eef2f7;text-align:left}
  th{background:#f8fafc;color:#475569}
  .bar{height:8px;background:#2563eb;border-radius:4px;display:inline-block;vertical-align:middle}
  pre{background:#0f172a;color:#a5f3fc;padding:12px;border-radius:10px;overflow:auto;font-size:12px}
  .refresh{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
  .muted{color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<div id="ctop"></div>
<header><span>ADX 运营看板 / Dashboard</span><button class="refresh" onclick="load()">刷新</button></header>
<div class="wrap">
  <div class="grid" id="kpis"></div>
  <h3>实时指标 <span class="muted" id="be"></span></h3>
  <pre id="metrics"></pre>
  <h3>广告主 / 投放</h3>
  <table id="adv"><thead><tr><th>ID</th><th>名称</th><th>品类</th><th>余额(元)</th><th>花费(元)</th><th>曝光</th><th>点击</th><th>转化</th></tr></thead><tbody></tbody></table>
  <h3>SSP 媒体方结算</h3>
  <table id="ssp"><thead><tr><th>媒体方</th><th>胜出</th><th>总流水(元)</th><th>分成(元)</th><th>SSP毛利(元)</th></tr></thead><tbody></tbody></table>
  <h3>激励视频发放</h3>
  <table id="rw"><thead><tr><th>状态</th><th>次数</th></tr></thead><tbody></tbody></table>
</div>
<script src="/admin.js"></script>
<script>
async function load(){
  try{
    const ov = await (await fetch('/api/console/overview')).json();
    const ms = await (await fetch('/metrics')).json();
    document.getElementById('be').textContent = 'backend: ' + (ms.backend||'-');
    const p = ov.platform||{};
    const kpis = [
      ['总流水(元)', (p.grossMicros||0)/1e6],
      ['今日曝光', p.todayImpressions||0],
      ['今日流水(元)', (p.todayGrossMicros||0)/1e6],
      ['激励发放', (ov.reward||{}).granted||0]
    ];
    document.getElementById('kpis').innerHTML = kpis.map(k=>`<div class="card"><div class="k">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('');
    document.getElementById('metrics').textContent = JSON.stringify(ms, null, 2);
    document.querySelector('#adv tbody').innerHTML = (ov.advertisers||[]).map(a=>`<tr><td>${a.id}</td><td>${a.name}</td><td>${a.app_category||'-'}</td><td>${(a.balance_micros/1e6).toFixed(0)}</td><td>${(a.spend_micros/1e6).toFixed(2)}</td><td>${a.impressions||0}</td><td>${a.clicks||0}</td><td>${a.conversions||0}</td></tr>`).join('');
    const rep = await (await fetch('/ssp/report')).json();
    document.querySelector('#ssp tbody').innerHTML = (rep.publishers||[]).map(r=>`<tr><td>${r.publisher}</td><td>${r.wins}</td><td>${r.gross_cny.toFixed(2)}</td><td>${r.payout_cny.toFixed(2)}</td><td>${r.ssp_margin_cny.toFixed(2)}</td></tr>`).join('');
    const rw = ov.reward||{};
    document.querySelector('#rw tbody').innerHTML = [['发放',rw.granted||0],['拒绝',rw.rejected||0],['总计',rw.total||0]].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('');
  }catch(e){ document.getElementById('metrics').textContent = '加载失败: '+e.message; }
}
load();
setInterval(load, 10000);
</script>
<script src="/console_top.js"></script>
</body>
</html>
